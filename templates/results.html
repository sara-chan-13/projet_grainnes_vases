<!DOCTYPE html>
<html>
<head>
    <title>Résultats</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 10px; text-align: left; }
        th { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>
    <h1> Database:</h1>
    <table>
        <tr>
            <th>ID</th> <th>Q1</th> <th>Q2</th> <th>Q3</th> <th>Budget</th> <th>Style</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/questionnaire">ajouter une autre repense</a>
</body>
</html>
